config_version = 2

[accessibility]
ui_scale = 1.1500000096857548

[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 0.99999997764825821

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.79999998211860657
end = [ "tray", "recorder", "notifications", "volume", "session" ]
font_family = "JetBrainsMono Nerd Font Propo"
hover_highlight = false
margin_edge = 10
margin_ends = 10
padding = 16
panel_overlap = 0
radius = 30
scale = 1.2500000111758709
start = [ "launcher", "wallpaper", "workspaces", "nix-monitor" ]
thickness = 48
widget_spacing = 9

[brightness]
enable_ddcutil = true

[control_center]
hidden_tabs = [ "power" ]
sidebar_section = "none"
width = 800

[dock]
background_opacity = 0.79999998211860657
cross_axis_padding = 12
enabled = true
inactive_opacity = 0.99999997764825821
inactive_scale = 1.0
launcher_icon = "rocket"
margin_edge = 10
pinned = [ "firefox", "org.gnome.Nautilus", "codium", "vesktop", "steam" ]
radius = 30
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[hot_corners]
enabled = true

    [hot_corners.top_right]
    action = "control_center"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.79999998211860657
monitors = [ "DP-1" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 288.0
    box_width = 592.0
    cx = 1280.0
    cy = 256.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0

[notification]
background_opacity = 0.79999998211860657
monitors = [ "DP-1" ]

[osd]
background_opacity = 0.79999998211860657
monitors = [ "DP-1" ]

    [osd.kinds]
    media = false

[plugin_settings."avivbintangaringga/nix-monitor"]
branch = "nixos-unstable"
clean_command = "nh clean all"
panel_placement = "floating"
update_command = "nix flake update --flake ~/NixOS-Dots/nixos"

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true
browser_placement = "floating"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/wallhaven", "avivbintangaringga/nix-monitor" ]

[shell]
avatar_path = "/home/elias/NixOS-Dots/misc/images/DANCs48XcAIsP6j.jpg"
button_borders = false
clipboard_image_action_command = "waytator"
corner_radius_scale = 2.0
font_family = "JetBrainsMono Nerd Font Propo"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.animation]
    speed = 0.7500000111758709

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    clipboard_position = "auto"
    control_center_placement = "floating"
    floating_offset = 12
    launcher_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_position = "auto"
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.screenshot]
    directory = "~/Bilder/Bildschirmfotos"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "Monochrome"
custom_palette = "Everforest Alt"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "pywalfox", "vscode", "discord", "papirus-icons" ]

[wallpaper]
directory = "~/Wallpapers/Walls"
transition = [ "disc", "fade", "wipe" ]

    [wallpaper.default]
    path = "/home/elias/Wallpapers/Walls/Kirschast.jpg"

    [wallpaper.last]
    path = "/home/elias/Wallpapers/Walls/Kirschast.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/elias/Wallpapers/Walls/Kirschast.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/elias/Wallpapers/Walls/Kirschast.jpg"

[widget.clock]
format = " {:%H:%M Uhr - 󰃮 %a, %d.%m.%y}"
vertical_format = "\\\\n{:%H\\\\n%M\\\\n-\\\\n󰃮\\\\n%a\\\\n%d\\\\n%m\\\\n%y}"

[widget.launcher]
custom_image = "~/NixOS-Dots/misc/images/nixos.svg"
custom_image_colorize = true

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
detached_panel = true
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
display = "name"
labels_only_when_occupied = true